[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebook-lint"
version = "0.1.0"
description = "Lint Jupyter notebooks for committed outputs, secrets, out-of-order execution, and cells that no longer run."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["jupyter", "notebook", "lint", "ci", "secrets", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Jupyter",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
notebook-lint = "notebook_lint.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/notebook-lint"
Issues = "https://github.com/hellpuffyt/notebook-lint/issues"
Changelog = "https://github.com/hellpuffyt/notebook-lint/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
# The example notebook is deliberately broken - it is what the tool exists
# to find. Linting fixture data defeats the fixture.
extend-exclude = ["examples"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["notebook_lint"]

[tool.coverage.report]
show_missing = true
