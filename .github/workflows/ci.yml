name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: coverage floor
        run: pytest -q --cov --cov-fail-under=95

  audit-the-example:
    name: lint the bundled example end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e .

      # The example deliberately contains out-of-order execution, a stale
      # name, and committed output — all warnings — plus a placeholder
      # credential that must NOT fire. Exit codes asserted exactly.
      - name: exit codes are exactly as documented
        run: |
          set -euo pipefail
          notebook-lint examples > /dev/null
          set +e
          notebook-lint examples --fail-on warning > /dev/null
          gate=$?
          set -e
          test "$gate" = "3"
          notebook-lint examples --format json --fail-on never             | python -c "
          import json, sys
          run = json.load(sys.stdin)
          checks = {f['check'] for f in run['findings']}
          assert checks == {'outputs', 'order', 'staleness'}, checks
          assert run['summary']['error'] == 0, run['summary']
          assert not any(f['check'] == 'secrets' for f in run['findings']), 'placeholder was wrongly flagged'
          print('example lints exactly as documented')
          "

      - name: zero runtime dependencies
        run: |
          set -euo pipefail
          python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          assert deps == [], f"runtime dependencies declared: {deps}"
          print("dependencies = [] holds")
          EOF
